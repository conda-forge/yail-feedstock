{% set name = "yail" %}
{% set version = "0.0.2" %}
{% set sha256 = "d86993aee0828e757f0fc737dd16ab80652959f164ed954afe9fdae4ece6b97b" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}
    - future >=0.15.2
    - toolz >=0.8.0

test:
  requires:
    - python {{ python_min }}
  source_files:
    - tests

  imports:
    - yail

  commands:
    - python -m unittest discover -s .

about:
  home: https://github.com/jakirkham/yail
  license: BSD 3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Yet Another Iterator Library for Python.
  doc_url: https://yail.readthedocs.io/
  dev_url: https://github.com/jakirkham/yail

extra:
  recipe-maintainers:
    - jakirkham
